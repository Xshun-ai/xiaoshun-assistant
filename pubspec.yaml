name: campus_assistant
description: "非官方校园助手（Flutter）"
publish_to: 'none'
repository: https://github.com/Xshun-ai/xiaoshun-assistant
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^10.3.4
  dart_sm: ^0.1.4
  package_info_plus:
    path: third_party/package_info_plus
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  fl_chart: ^0.69.0
  open_file: ^3.5.10
  html: ^0.15.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/json/campus_markers.json
